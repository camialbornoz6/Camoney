<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Camoney</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png?v=2">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Camoney">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --bg:#000000; --card:#141414; --ink:#FFFFFF; --mute:#9A9A9A; --line:#262626;
  --acc:#C9B3FF; --on-acc:#1A0F33; --acc-soft:#2A2140; --in:#4ADE80; --out:#FF5C5C; --in-on-acc:#0B6B35; --out-on-acc:#B3261E; --warn:#F2C14E;
  --r:18px; --nav:68px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,sans-serif;font-size:15px}
body{padding-top:env(safe-area-inset-top);padding-bottom:calc(var(--nav) + env(safe-area-inset-bottom) + 24px);min-height:100vh}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.hidden{display:none!important}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:14px 18px 10px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{font-weight:800;font-size:18px;letter-spacing:-.3px}
.brand small{display:block;font-weight:500;font-size:12px;color:var(--mute);letter-spacing:0}
.mswitch{display:flex;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px}
.mswitch button{border:0;background:none;width:32px;height:32px;border-radius:50%;font-size:18px;line-height:1}
.mswitch button:active{background:var(--acc-soft)}
.mswitch span{min-width:108px;text-align:center;font-weight:700;font-size:14px;text-transform:capitalize}
main{padding:4px 16px 0;max-width:640px;margin:0 auto}
.banner{margin:0 16px 10px;padding:10px 14px;border-radius:12px;background:#2E2410;color:#F2D58A;font-size:13px;max-width:608px}
@media(min-width:672px){.banner{margin:0 auto 10px}}
.card{background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:12px;border:1px solid var(--line)}
.card h3{margin:0 0 12px;font-size:15px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.card h3 a,.link{color:var(--acc);font-size:13px;font-weight:700;text-decoration:none;background:none;border:0;padding:0}
.hero{background:var(--acc);color:var(--on-acc);border:0}
.hero .lbl{color:#4A2A8C;font-size:13px;font-weight:600}
.hero .big{font-size:34px;font-weight:800;letter-spacing:-1px;margin:2px 0 14px}
.hero .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
.hero .grid div{font-size:12px;color:#4A2A8C}
.hero .grid b{display:block;color:var(--on-acc);font-size:15px;font-weight:700}
.cmp{margin-top:12px;font-size:12px;background:rgba(26,15,51,.10);padding:7px 10px;border-radius:10px;display:inline-block}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--bg);border-radius:14px;padding:10px 12px}
.tile span{font-size:12px;color:var(--mute);display:block}
.tile b{font-size:15px}
.bars .b{margin-bottom:12px}
.bars .bh{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px;gap:8px}
.bars .bh span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bars .bh small{color:var(--mute)}
.track{height:8px;background:var(--bg);border-radius:99px;overflow:hidden;position:relative}
.fill{height:100%;background:var(--acc);border-radius:99px}
.fill.warn{background:var(--warn)}.fill.over{background:var(--out)}
.alert{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;margin-bottom:8px;font-size:13px;background:#3A1A12;color:#F5B9A3}
.alert.info{background:var(--acc-soft);color:#DCCDFF}
.alert button{margin-left:auto;border:0;background:var(--ink);color:var(--bg);border-radius:99px;padding:6px 12px;font-size:12px;font-weight:700}
.empty{color:var(--mute);font-size:13px;text-align:center;padding:14px 4px}
.list .day{font-size:12px;font-weight:700;color:var(--mute);margin:14px 4px 6px;text-transform:capitalize}
.item{display:flex;align-items:center;gap:12px;padding:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:6px;width:100%;text-align:left}
.ico{width:38px;height:38px;border-radius:12px;background:var(--bg);display:grid;place-items:center;font-size:19px;flex:none}
.item .mid{flex:1;min-width:0}
.item .mid b{display:block;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .mid small{color:var(--mute);font-size:12px}
.amt{font-weight:700;white-space:nowrap}
.amt.in{color:var(--in)}.amt.out{color:var(--out)}
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:6px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.fchip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:7px 13px;font-size:13px;font-weight:600;white-space:nowrap}
.fchip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.search{width:100%;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.ccard{border-radius:var(--r);padding:16px;color:#fff;margin-bottom:10px;position:relative}
.ccard .nm{font-weight:800;font-size:17px}
.ccard .dt{font-size:12px;opacity:.85;margin-top:2px}
.ccard .due{margin-top:14px;font-size:12px;opacity:.85}
.ccard .due b{display:block;font-size:24px;opacity:1;font-weight:800;letter-spacing:-.5px}
.ccard .row{display:flex;justify-content:space-between;margin-top:10px;font-size:12px}
.ccard .row b{display:block;font-size:14px}
.ccard .edit{position:absolute;top:12px;right:12px;border:0;background:rgba(255,255,255,.2);color:#fff;border-radius:99px;padding:5px 11px;font-size:12px;font-weight:700}
.ccard details{margin-top:10px;background:rgba(0,0,0,.14);border-radius:12px;padding:8px 10px;font-size:13px}
.ccard summary{cursor:pointer;font-weight:700}
.ccard .cl{display:flex;justify-content:space-between;padding:5px 0;border-top:1px solid rgba(255,255,255,.15);gap:8px}
.ccard .cl:first-of-type{border-top:0}
.ccard .split{margin-top:10px;background:rgba(0,0,0,.14);border-radius:12px;padding:8px 10px;font-size:13px}
.ccard .split .cl{align-items:center}
.ccard .usdl{margin-top:6px;font-size:12px;opacity:.9;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tg{display:inline-block;font-size:11px;font-weight:700;background:rgba(255,255,255,.2);border-radius:99px;padding:1px 7px;margin-left:5px;vertical-align:1px}
.pbtn{border:0;border-radius:99px;padding:4px 10px;font-size:12px;font-weight:700;background:rgba(255,255,255,.22);color:#fff;margin-left:8px}
.pbtn.on{background:#fff;color:#1A1A1A}
.wk{padding:10px 0;border-top:1px solid var(--line)}
.wk:first-of-type{border-top:0}
.wk .bh{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px;gap:8px}
.wk .bh small{color:var(--mute)}
.wk.cur .bh>span:first-child{color:var(--acc);font-weight:700}
.wk .rest{font-size:12px;color:var(--mute);margin-top:4px}
.owe{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.owe:first-of-type{border-top:0}
.owe .mid{flex:1;min-width:0}.owe .mid small{display:block;color:var(--mute);font-size:12px}
.vbars{display:flex;align-items:flex-end;gap:8px;height:130px;padding-top:18px}
.vbars .vb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:11px;color:var(--mute)}
.vbars .vb i{display:block;width:100%;max-width:34px;background:var(--acc);border-radius:8px 8px 3px 3px;min-height:3px}
.vbars .vb em{font-style:normal;font-size:10px;color:var(--ink);font-weight:700;margin-bottom:3px;white-space:nowrap}
.vbars .vb.cur i{background:var(--ink)}
.acc{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.acc:first-of-type{border-top:0}
.acc .mid{flex:1;min-width:0}
.acc .mid b{display:block;font-size:14px}
.acc .mid small{color:var(--mute);font-size:12px}
.mini{border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:6px 11px;font-size:12px;font-weight:700}
.goal{padding:12px 0;border-top:1px solid var(--line)}
.goal:first-of-type{border-top:0}
.goal .gh{display:flex;justify-content:space-between;font-size:14px;font-weight:600;margin-bottom:6px}
.goal small{color:var(--mute);font-size:12px;display:block;margin-top:5px}
.menu button{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;padding:13px 2px;border-top:1px solid var(--line);text-align:left;font-weight:600}
.menu button:first-child{border-top:0}
.hrow{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.hrow.cur{border-color:var(--acc)}
.hrow .ht{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px}
.hrow .ht b{font-size:15px;text-transform:capitalize}
.hrow .ht span{font-size:12px;color:var(--mute)}
.hrow .hg{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;font-size:11px;color:var(--mute)}
.hrow .hg b{display:block;font-size:14px;color:var(--ink)}
.hbar{height:6px;border-radius:99px;background:var(--line);margin-top:10px;overflow:hidden;display:flex}
.hbar i{display:block;height:100%}
.hyear{display:flex;justify-content:space-between;align-items:baseline;margin:16px 2px 8px;font-weight:800;font-size:16px}
.hyear small{font-weight:600;font-size:12px;color:var(--mute)}
.back{border:0;background:none;color:var(--acc);font-weight:700;padding:4px 0 10px;font-size:14px}
#mLabel{cursor:pointer}
.menu button span:last-child{margin-left:auto;color:var(--mute);font-weight:500;font-size:13px;white-space:nowrap}
.fix{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line)}
.fix:first-of-type{border-top:0}
.fix .mid{flex:1;min-width:0}.fix .mid b{display:block;font-size:14px}.fix .mid small{color:var(--mute);font-size:12px}
.ok{color:var(--in);font-size:12px;font-weight:700}
.btnrow{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:14px;font-weight:700;font-size:15px;margin-top:10px}
.btn.primary{background:var(--acc);color:var(--on-acc)}
.btn.ghost{background:var(--bg);color:var(--ink)}
.btn.danger{background:none;color:var(--out)}
.btn.sm{width:auto;padding:10px 16px;font-size:14px;margin-top:0}
#fab{position:fixed;right:18px;bottom:calc(var(--nav) + env(safe-area-inset-bottom) + 16px);width:58px;height:58px;border-radius:20px;border:0;background:var(--acc);color:var(--on-acc);font-size:30px;font-weight:400;box-shadow:0 8px 24px rgba(201,179,255,.25);z-index:6;line-height:1}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:7;background:rgba(10,10,10,.94);backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;border:0;background:none;height:var(--nav);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;color:var(--mute)}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.on{color:var(--acc)}
.sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.6)}
.sheet-body{position:relative;background:var(--card);width:100%;max-width:640px;max-height:92vh;overflow-y:auto;border-radius:24px 24px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom));animation:up .22s ease}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 6px}
.shead{position:sticky;top:-10px;z-index:3;background:var(--card);margin:-10px -18px 0;padding:10px 18px 2px;touch-action:none}
.shead .back{padding:6px 0 4px;font-size:15px}
.sheet-body.drag{transition:none}
.sheet h2{margin:4px 0 14px;font-size:19px;font-weight:800}
.seg{display:flex;background:var(--bg);border-radius:14px;padding:4px;margin-bottom:12px}
.seg label{flex:1}
.seg input,.chips input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:block;text-align:center;padding:9px;border-radius:11px;font-weight:700;font-size:14px;color:var(--mute)}
.seg input:checked+span{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.5)}
.bigin{display:flex;align-items:center;gap:6px;border-bottom:2px solid var(--line);margin-bottom:14px;padding:4px 2px}
.bigin span{font-size:28px;font-weight:700;color:var(--mute)}
.bigin input{border:0;outline:0;font-size:34px;font-weight:800;width:100%;background:none;letter-spacing:-1px}
.lab{font-size:12px;font-weight:700;color:var(--mute);margin:12px 0 6px;text-transform:uppercase;letter-spacing:.4px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips label span{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:99px;padding:7px 11px;font-size:13px;font-weight:600;background:var(--card)}
.chips input:checked+span{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}
.fld{display:block;margin-top:12px}
.fld>span{display:block;font-size:12px;font-weight:700;color:var(--mute);margin-bottom:5px;text-transform:uppercase;letter-spacing:.4px}
.fld input,.fld select{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:12px;font-size:15px;outline:0}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--acc)}
.fld textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:12px;font-size:15px;outline:0;font:inherit;color:inherit;resize:vertical;min-height:70px}
.chk{display:flex;align-items:center;gap:10px;margin-top:14px;font-weight:600}
.chk input{width:20px;height:20px;accent-color:var(--acc)}
.debt .mid small{display:block}
.debt.paid{opacity:.55}
.debt.paid .amt{text-decoration:line-through}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hint{font-size:13px;color:var(--acc);font-weight:600;margin-top:8px}
.note{font-size:13px;color:var(--mute);line-height:1.5}
.budrow{display:flex;align-items:center;gap:10px;margin-top:8px}
.budrow span{flex:1;font-size:14px}
.budrow span small{display:block;color:var(--mute);font-size:12px}
.bars .rest{font-size:12px;color:var(--mute);margin-top:4px}
.bsum{position:sticky;bottom:calc(-22px - env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--line);margin:14px -18px 0;padding:12px 18px calc(4px + env(safe-area-inset-bottom));font-size:13px;color:var(--mute)}
.bsum b{color:var(--ink)}
.budrow input{width:140px;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px;text-align:right}
#toast{position:fixed;left:50%;bottom:calc(var(--nav) + env(safe-area-inset-bottom) + 90px);transform:translateX(-50%) translateY(20px);background:#2A2140;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;transition:.2s;z-index:30;pointer-events:none;max-width:86vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}
body.auth nav.tabs,body.auth #fab,body.auth .mswitch{display:none!important}
.loading{text-align:center;color:var(--mute);padding:60px 0}
</style>
</head>
<body>
<header class="top">
  <div class="brand">Ca<span style="color:var(--acc)">money</span><small id="sub">Tu plata, en orden</small></div>
  <div class="mswitch"><button id="prevM" aria-label="Mes anterior">‹</button><span id="mLabel"></span><button id="nextM" aria-label="Mes siguiente">›</button></div>
</header>
<div id="banner" class="banner hidden"></div>
<main id="view"><div class="loading">Cargando tus datos…</div></main>
<button id="fab" aria-label="Agregar movimiento">+</button>
<nav class="tabs">
  <button data-tab="inicio" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Inicio</button>
  <button data-tab="movs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>Movimientos</button>
  <button data-tab="cards"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="2" y="5" width="20" height="14" rx="3"/><path d="M2 10h20M6 15h4"/></svg>Tarjetas</button>
  <button data-tab="sav"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 7c-1-1.5-3-2-5-2H9C5.7 5 3 7.7 3 11c0 2 1 3.8 2.5 4.9V20h3v-2h5v2h3v-3.3c1-.6 1.8-1.4 2.3-2.4H21v-4h-1.4c-.2-.9-.5-1.7-.6-2.3zM16 11h.01"/></svg>Ahorros</button>
  <button data-tab="mas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>Más</button>
</nav>
<div id="sheet" class="sheet hidden"><div class="sheet-bg" id="sheetBg"></div><div class="sheet-body" id="sheetBody"><div class="shead" id="sheetHead"><div class="grab"></div><button class="back" id="sheetBack">‹ Volver</button></div><div id="sheetIn"></div></div></div>
<div id="toast"></div>

<script>
"use strict";
/* ---------- utilidades ---------- */
const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2, "0");
const gid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const todayStr = () => { const d = new Date(); return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); };
const ymOf = s => String(s).slice(0, 7);
const addM = (ym, k) => { let [y, m] = ym.split("-").map(Number); m += k; y += Math.floor((m - 1) / 12); m = ((m - 1) % 12 + 12) % 12 + 1; return y + "-" + pad(m); };
const diffM = (a, b) => { const [ya, ma] = a.split("-").map(Number), [yb, mb] = b.split("-").map(Number); return (yb - ya) * 12 + (mb - ma); };
const MESES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const mName = ym => { const [y, m] = ym.split("-"); return MESES[m - 1] + " " + y; };
const mOnly = ym => MESES[ym.split("-")[1] - 1];
const mShort = ym => mOnly(ym).slice(0, 3);
const DIAS = ["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
const dayLabel = s => { const [y, m, d] = s.split("-").map(Number); const dt = new Date(y, m - 1, d); return DIAS[dt.getDay()] + " " + d + " de " + MESES[m - 1]; };
const nf0 = new Intl.NumberFormat("es-AR", {maximumFractionDigits: 0});
const nf2 = new Intl.NumberFormat("es-AR", {minimumFractionDigits: 2, maximumFractionDigits: 2});
const money = (n, cur = "ARS") => { n = Number(n) || 0; const neg = n < 0; n = Math.abs(n); const s = (Math.round(n) === Math.round(n * 100) / 100 ? nf0 : nf2).format(Math.round(n * 100) / 100); return (neg ? "−" : "") + (cur === "USD" ? "US$ " : "$ ") + s; };
const numIn = n => String(n).replace(".", ",");
function parseAmt(v) {
  v = String(v || "").trim().replace(/[^\d.,]/g, "");

  if (v.includes(",")) v = v.replace(/\./g, "").replace(",", ".");
  else if ((v.match(/\./g) || []).length > 1 || /\.\d{3}$/.test(v)) v = v.replace(/\./g, "");

}

function persist(docId) {

  queues[docId] = prev.then(() => db.doc(base + "/" + docId).set(body)).catch(e => {

    else if (code === "unavailable") setTimeout(() => persist(docId), 800 + Math.random() * 800);
    else if (code === "invalid_argument") toast("No se pudo guardar. Revisá que tengas acceso para editar.");

}

/* ---------- cálculos ---------- */
function firstDue(c, date) {
  const [y, m, d] = date.split("-").map(Number);
  let close = y + "-" + pad(m);
  const cierre = (c && c.cierre) || 31, venc = (c && c.venc) || 10;
  if (d > cierre) close = addM(close, 1);
  return venc > cierre ? close : addM(close, 1);
}
function cardSchedule(ymT) {
  const out = [];
  for (const it of allItems()) {
    if (it.type !== "gasto" || !String(it.method).startsWith("card:")) continue;
    const cid = it.method.slice(5), c = card(cid), n = Math.max(1, it.cuotas || 1);
    const k = diffM(firstDue(c, it.date), ymT);
    if (k < 0 || k >= n) continue;
    const per = it.amount / n, usd = isUsd(it);
    out.push({mov: it, cardId: cid, k: k + 1, n, ym: ymT, who: it.who || "", usd: usd ? per : 0, amt: usd ? per * cardRate(cid, ymT) : per});
  }
  return out;
}
/* dólar de cada resumen: si no se cargó uno para esa tarjeta y mes, se usa la cotización general */
const cardRate = (cid, ym) => Number((S.cfg.cardUsd || {})[cid + "|" + ym]) || Number(S.cfg.usd) || 0;
const isUsd = it => it.cur === "USD";
const paidKey = (cid, ym, who) => cid + "|" + ym + "|" + who;
const isPaid = (cid, ym, who) => !!(S.cfg.paid || {})[paidKey(cid, ym, who)];
function movArs(it) {
  if (!isUsd(it)) return it.amount;
  const cid = String(it.method).startsWith("card:") ? it.method.slice(5) : "";
  return it.amount * (cid ? cardRate(cid, firstDue(card(cid), it.date)) : Number(S.cfg.usd) || 0);
}
function owedBy(sched) {
  const map = {};
  for (const s of sched) {
    if (!s.who) continue;
    const p = map[s.who] || (map[s.who] = {who: s.who, total: 0, pend: 0, cards: {}});
    p.total += s.amt; p.cards[s.cardId] = true;
    if (!isPaid(s.cardId, s.ym, s.who)) p.pend += s.amt;
  }
  return Object.values(map).sort((a, b) => b.total - a.total);
}
function weekRanges(ym) { const [y, m] = ym.split("-").map(Number), last = new Date(y, m, 0).getDate(); return [[1, 7], [8, 14], [15, 21], [22, last]]; }
function weeklyData(ym) {
  const cats = (S.cfg.weekly && S.cfg.weekly.cats) || [];
  const r = weekRanges(ym).map(([a, b]) => ({a, b, sp: 0}));
  for (const it of S.months[ym] || []) {
    if (it.type !== "gasto" || String(it.method).startsWith("card:") || !cats.includes(it.cat)) continue;
    r[Math.min(3, Math.floor((Number(it.date.slice(8, 10)) - 1) / 7))].sp += it.amount;
  }
  return r;
}
function accBalance(a) { return (Number(a.initial) || 0) + S.sav.filter(s => s.accId === a.id).reduce((t, s) => t + s.amount, 0); }
function savTotals() {
  let ars = 0, usd = 0;
  for (const a of S.cfg.accounts) { const b = accBalance(a); if (a.cur === "USD") usd += b; else ars += b; }
  return {ars, usd, total: ars + usd * (Number(S.cfg.usd) || 0)};
}
function stats(ym) {
  const items = S.months[ym] || [];
  let ing = 0, direct = 0; const byMethod = {efectivo: 0, debito: 0, mp: 0, tarjetas: 0}, byCat = {};
  for (const it of items) {
    if (it.type === "ingreso") { ing += it.amount; continue; }
    if (String(it.method).startsWith("card:")) continue;
    direct += it.amount; byMethod[it.method] = (byMethod[it.method] || 0) + it.amount; byCat[it.cat] = (byCat[it.cat] || 0) + it.amount;
  }
  const sched = cardSchedule(ym); let cards = 0, others = 0, noRate = false;
  for (const s of sched) {
    if (s.usd && !cardRate(s.cardId, ym)) noRate = true;
    if (s.who) { others += s.amt; continue; }
    cards += s.amt; byCat[s.mov.cat] = (byCat[s.mov.cat] || 0) + s.amt;
  }
  const owed = owedBy(sched).reduce((t, p) => t + p.pend, 0);
  byMethod.tarjetas = cards;
  let ahorro = 0;
  for (const s of S.sav) {
    if (ymOf(s.date) !== ym) continue;
    const a = acc(s.accId); if (!a) continue;
    if (a.cur === "USD") { if (s.ars) ahorro += s.ars; } else ahorro += s.amount;
  }
  return {ing, direct, cards, others, owed, noRate, ahorro, gastos: direct + cards, disp: ing - direct - cards - ahorro, byMethod, byCat, sched};
}
function pendingFixed(ym) {

  const prev = budMonths().filter(k => k < ym).pop();

    const c = cat(id), bud = withBudget ? Number(S.cfg.budgets[id]) || 0 : 0;

  const ppl = S.cfg.people || [];
  openSheet(`<h2>Personas que usan tus tarjetas</h2><div class="note">Cuando cargás una compra con tarjeta podés elegir de quién es. Esos gastos no se descuentan de tu disponible y aparecen en “Lo que te tienen que pagar”.</div>
    ${ppl.length ? ppl.map((p, i) => `<div class="fix"><div class="ico">👤</div><div class="mid"><b>${esc(p)}</b></div><button class="mini" data-act="delPerson" data-id="${i}">Quitar</button></div>`).join("") : `<div class="empty">Todavía no agregaste a nadie.</div>`}
    <form id="f" style="display:flex;gap:8px;margin-top:12px"><input name="n" maxlength="30" placeholder="Nombre" style="flex:1;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:12px"><button class="btn primary sm">Agregar</button></form>
    <div class="note" style="margin-top:10px">Quitar a alguien de la lista no borra sus compras ya cargadas.</div>`);
  const f = $("#f");
  f.onsubmit = e => { e.preventDefault(); const n = val(f, "n").trim(); if (!n) return; if (ppl.some(p => p.toLowerCase() === n.toLowerCase())) { toast("Ya está en la lista"); return; } S.cfg.people = [...ppl, n]; persist("config"); peopleForm(); render(); };
}
function csv(rows) { return "﻿" + rows.map(r => r.map(v => { v = String(v ?? ""); return /[;"\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }).join(";")).join("\r\n"); }
function exportData(scope) {
  let items = scope === "all" ? allItems() : (S.months[S.month] || []);
  items = items.slice().sort((a, b) => a.date.localeCompare(b.date));
  const rows = [["Fecha", "Tipo", "Categoría", "Medio de pago", "Cuotas", "Monto", "Moneda", "De quién", "Nota"]];
  for (const i of items) rows.push([i.date.split("-").reverse().join("/"), i.type === "gasto" ? "Gasto" : "Ingreso", cat(i.cat).n, methodLabel(i.method), i.cuotas || 1, String(i.amount).replace(".", ","), isUsd(i) ? "USD" : "ARS", i.who || "Yo", i.note || ""]);
  if (scope === "all") { rows.push([]); rows.push(["AHORROS"]); rows.push(["Fecha", "Cuenta", "Moneda", "Monto", "Pesos usados", "Nota"]); for (const s of S.sav.slice().sort((a, b) => a.date.localeCompare(b.date))) { const a = acc(s.accId); rows.push([s.date.split("-").reverse().join("/"), a ? a.name : "", a ? a.cur : "", String(s.amount).replace(".", ","), s.ars ? String(s.ars).replace(".", ",") : "", s.note || ""]); } }
  return {data: csv(rows), filename: scope === "all" ? "mis-finanzas-completo.csv" : "mis-finanzas-" + S.month + ".csv", count: items.length};
}
function exportForm() {
  openSheet(`<h2>Exportar a Excel</h2><div class="note">Se baja un archivo CSV que abre directo en Excel o Google Sheets.</div>
    <button class="btn primary" data-act="doExport" data-scope="month">Movimientos de ${mName(S.month)}</button>
    <button class="btn ghost" data-act="doExport" data-scope="all">Todo (movimientos y ahorros)</button>
    <button class="btn danger" data-act="copyExport">Copiar como texto</button>`);
}
function fileDownload(filename, data, type) {
  const url = URL.createObjectURL(new Blob([data], {type}));
  const a = document.createElement("a"); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}
async function saveFile(filename, data, type) {
  if (STANDALONE) { fileDownload(filename, data, type); return; }
  const dl = window.claude && await window.claude.use("downloads"); if (!dl) throw 0; await dl.save({filename, data});
}
async function doExport(scope) {
  const x = exportData(scope);
  if (STANDALONE) { fileDownload(x.filename, x.data, "text/csv;charset=utf-8"); toast("Archivo listo"); return; }
  try { const dl = window.claude && await window.claude.use("downloads"); if (!dl) throw 0; await dl.save({filename: x.filename, data: x.data}); toast("Archivo listo"); }
  catch (e) { try { await navigator.clipboard.writeText(x.data.slice(1)); toast("No pude bajar el archivo: lo copié para que lo pegues en Excel"); } catch (e2) { toast("No se pudo exportar desde acá"); } }
}
function aboutForm() {
  openSheet(`<h2>Tus datos</h2><div class="note">
    ${S.mode === "fb" ? "Tus datos se guardan en tu cuenta de Camoney (" + esc(S.user) + "), en un espacio privado: solo vos podés verlos. Se sincronizan entre el celu y la compu, y si no tenés internet podés seguir cargando: se suben solos cuando vuelve la conexión." : STANDALONE ? "Tus datos se guardan <b>solo en este celular</b>, dentro de la app. No se mandan a ningún servidor y nadie más puede verlos.<br><br>Como no hay copia en la nube, si borrás la app o los datos del navegador se pierden. Hacé una <b>copia de seguridad</b> de vez en cuando (en Más → Copia de seguridad) y guardala en tu Drive o mandátela por mail." : S.mode === "db" ? "Tus datos se guardan en tu cuenta de Claude, en un espacio privado: nadie más que vos puede verlos, ni siquiera si compartís el link de la app. Se sincronizan entre tus dispositivos." : "Ahora mismo estás en <b>modo local</b>: los datos quedan solo en este navegador. Abrí la app desde Claude con tu sesión iniciada para guardarlos en la nube."}
    <br><br>Los montos de tarjetas se calculan con las fechas de cierre que cargaste; tomalos como estimación y chequealos contra el resumen real.</div>
    <button class="btn ghost" data-act="close">Entendido</button>`);
}

function backupForm() {
  openSheet(`<h2>Copia de seguridad</h2><div class="note">Descargá un archivo con <b>todos</b> tus datos: movimientos, tarjetas, ahorros, metas y configuración. Guardalo en Drive o mandátelo por mail. Si cambiás de celu, lo restaurás y queda todo igual.</div>
    <button class="btn primary" data-act="doBackup">Descargar copia</button>
    <button class="btn ghost" data-act="restore">Restaurar desde un archivo</button>
    <input type="file" id="restoreFile" accept=".json,application/json" class="hidden">
    <div class="note" style="margin-top:10px">Ojo: restaurar reemplaza lo que tenés ahora por lo que hay en el archivo.</div>`);
  $("#restoreFile").onchange = e => { const file = e.target.files[0]; if (!file) return; const r = new FileReader(); r.onload = () => restoreBackup(r.result); r.readAsText(file); };
}
async function doBackup() {
  const data = JSON.stringify({app: "camoney", v: 1, exported: new Date().toISOString(), cfg: S.cfg, months: S.months, sav: S.sav});
  try { await saveFile("camoney-copia-" + todayStr() + ".json", data, "application/json"); toast("Copia descargada"); }
  catch (e) { try { await navigator.clipboard.writeText(data); toast("No pude bajar el archivo: copié los datos"); } catch (e2) { toast("No se pudo hacer la copia desde acá"); } }
}
function restoreBackup(text) {
  let d; try { d = JSON.parse(text); } catch (e) { toast("Ese archivo no es una copia de Camoney"); return; }
  if (!d || d.app !== "camoney" || typeof d.months !== "object") { toast("Ese archivo no es una copia de Camoney"); return; }
  const btn = document.querySelector('[data-act="restore"]');
  if (!btn.dataset.armed) { btn.dataset.armed = 1; btn.textContent = "Tocá de nuevo para reemplazar todo"; btn.dataset.act = "restoreGo"; btn.onclick = () => applyRestore(d); return; }
}
function applyRestore(d) {
  const oldMonths = Object.keys(S.months);
  applyCfg(d.cfg); S.months = {}; for (const k in d.months) if (/^\d{4}-\d{2}$/.test(k)) S.months[k] = cleanItems(d.months[k]); S.sav = cleanItems(d.sav);
  if (S.mode === "local") saveLocal();
  else { persist("config"); persist("savings"); for (const k of new Set([...oldMonths, ...Object.keys(S.months)])) { if (!S.months[k]) S.months[k] = []; saveMonth(k); } }
  closeSheet(); toast("Datos restaurados"); render();
}

/* ---------- eventos ---------- */
document.addEventListener("click", e => {
  const tabBtn = e.target.closest("[data-tab]");
  if (tabBtn) { S.tab = tabBtn.dataset.tab; window.scrollTo(0, 0); render(); return; }
  const el = e.target.closest("[data-act]"); if (!el) return;
  const id = el.dataset.id, a = el.dataset.act;
  switch (a) {
    case "editMov": { const it = findMov(id); if (it) movForm(it); break; }
    case "filt": S.filter[el.dataset.k] = el.dataset.v; render(); break;
    case "newCard": cardForm(); break;
    case "editCard": cardForm(card(id)); break;
    case "newAcc": accForm(); break;
    case "editAcc": accForm(acc(id)); break;
    case "savMov": savForm(id, Number(el.dataset.dir)); break;
    case "editSav": { const s = S.sav.find(x => x.id === id); if (s) savForm(null, 0, s); break; }
    case "newGoal": goalForm(); break;
    case "editGoal": goalForm(S.cfg.goals.find(g => g.id === id)); break;
    case "newFixed": fixedForm(); break;
    case "editFixed": fixedForm(S.cfg.fixed.find(x => x.id === id)); break;
    case "regFixed": regFixed(id); break;
    case "goFixed": S.tab = "mas"; render(); setTimeout(() => { const c = $("#fixedCard"); if (c) c.scrollIntoView({behavior: "smooth"}); }, 50); break;
    case "budgets": budgetsForm(); break;
    case "cats": catsForm(); break;
    case "newCat": catForm(); break;
    case "editCat": catForm(S.cfg.cats.find(c => c.id === id)); break;
    case "usd": usdForm(); break;
    case "export": exportForm(); break;
    case "doExport": doExport(el.dataset.scope); break;
    case "copyExport": { const x = exportData("all"); navigator.clipboard.writeText(x.data.slice(1)).then(() => toast("Copiado"), () => toast("No pude copiar")); break; }
    case "about": aboutForm(); break;
    case "logout": logout(); break;
    case "backup": backupForm(); break;
    case "doBackup": doBackup(); break;
    case "restore": $("#restoreFile").click(); break;
    case "close": closeSheet(); break;
    case "tab": S.tab = el.dataset.v; window.scrollTo(0, 0); render(); break;
    case "newDebt": debtForm(); break;
    case "editDebt": { const d = (S.cfg.debts || []).find(x => x.id === id); if (d) debtForm(d); break; }
    case "viewDebt": { const d = findDebt(id); if (d) debtView(d); break; }
    case "togglePaid": { const k = paidKey(id, S.month, el.dataset.who), p = {...(S.cfg.paid || {})}; if (p[k]) delete p[k]; else p[k] = true; S.cfg.paid = p; persist("config"); render(); break; }
    case "cardUsd": cardUsdForm(id); break;
    case "weekly": weeklyForm(); break;
    case "people": peopleForm(); break;
    case "delPerson": { const ppl = (S.cfg.people || []).slice(); ppl.splice(Number(id), 1); S.cfg.people = ppl; persist("config"); peopleForm(); render(); break; }
    case "goMonth": S.month = id; S.tab = "inicio"; window.scrollTo(0, 0); render(); break;
  }
});
$("#fab").onclick = () => movForm();
$("#sheetBg").onclick = sheetBack;
$("#prevM").onclick = () => { S.month = addM(S.month, -1); render(); };
$("#mLabel").onclick = () => { S.tab = "hist"; window.scrollTo(0, 0); render(); };
$("#nextM").onclick = () => { S.month = addM(S.month, 1); render(); };
document.addEventListener("keydown", e => { if (e.key === "Escape" && sheetOpen()) sheetBack(); });
$("#sheetBack").onclick = sheetBack;
/* deslizar hacia abajo desde arriba de la hoja para volver */
(() => { const sb = $("#sheetBody"); let y0 = null, dy = 0;
  sb.addEventListener("touchstart", e => { const onHead = e.target.closest("#sheetHead"); y0 = (onHead || sb.scrollTop <= 0) && !e.target.closest("input,textarea,select") ? e.touches[0].clientY : null; dy = 0; }, {passive: true});
  sb.addEventListener("touchmove", e => { if (y0 === null) return; dy = e.touches[0].clientY - y0; if (dy > 0) { sb.classList.add("drag"); sb.style.transform = "translateY(" + dy + "px)"; } else { y0 = null; sb.style.transform = ""; } }, {passive: true});
  sb.addEventListener("touchend", () => { sb.classList.remove("drag"); if (y0 !== null && dy > 110) { sb.style.transform = ""; sheetBack(); } else sb.style.transform = ""; y0 = null; }); })();

render();
initStore();
if ("serviceWorker" in navigator && location.protocol === "https:") { try { navigator.serviceWorker.register("sw.js").catch(() => {}); } catch (e) {} }
</script>
</body>
</html>
